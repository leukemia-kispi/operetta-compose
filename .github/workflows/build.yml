name: Build and deploy

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          # Reuse the committed pixi.lock; cache the solved environment.
          cache: true

      - name: Check that the Fractal manifest is up to date
        run: pixi run fractal-manifest check --package operetta-compose

      - name: Run tests
        run: pixi run test

  pypi-publish:
    if: success() && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs:
      - test
    permissions:
      # Mandatory for trusted publishing to PyPI (https://docs.pypi.org/trusted-publishers/).
      id-token: write
      # Allows creating the GitHub Release.
      contents: write
    environment:
      name: pypi
      url: https://pypi.org/p/operetta-compose
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history + tags so hatch-vcs can resolve the version from the tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true

      - name: Build sdist and wheel
        run: pixi run build

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: './dist/*'
