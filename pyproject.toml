# Project metadata (see https://packaging.python.org/en/latest/guides/writing-pyproject-toml/)
[project]
name = "operetta-compose"
dynamic = ["version"]
description = "Fractal tasks for the Opera/Operetta microscope and drug response profiling"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "Fabio Steffen", email = "fabio.steffen@uzh.ch" },
]

# Required Python version and runtime dependencies
requires-python = ">=3.11,<3.15"
dependencies = [
    "ngio>=0.5,<0.6",
    "fractal-task-tools>=0.5.0,<0.6.0",
    "pandas>=2",
    "pydantic>=2",
    "feature-classifier-core>=0.4,<0.5",
]

[project.optional-dependencies]
# Only required to run the `spot_detection` task (pulls in torch via spotiflow).
spotiflow = ["spotiflow"]
dev = [
    "hatch",
    "hatch-vcs",
    "pytest",
    "pytest-cov",
    "requests",
    "jsonschema",
    "ruff",
    "pre-commit",
]

[project.urls]
Documentation = "https://leukemia-kispi.github.io/operetta-compose/"
Repository = "https://github.com/leukemia-kispi/operetta-compose.git"
Issues = "https://github.com/leukemia-kispi/operetta-compose/issues"

# Build backend: hatchling with a git-tag-driven version (hatch-vcs), matching
# the fractal-tasks-template / ngio conventions.
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is derived from git tags (e.g. the `0.2.14` tag). Release by
# tagging a commit instead of editing a static version string.
[tool.hatch.version]
source = "vcs"

# Ship the whole package directory (including __FRACTAL_MANIFEST__.json, which
# hatchling includes automatically as it lives inside the package).
[tool.hatch.build.targets.wheel]
packages = ["src/operetta_compose"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests",
    "docs",
    ".github",
    "**/*.ipynb_checkpoints",
    "**/*.ipynb",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]
# Keep the doc notebooks out of lint/format runs.
extend-exclude = ["docs", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
# Re-export of `tasks` and metadata bootstrap intentionally follow module code.
"src/operetta_compose/__init__.py" = ["E402", "F401"]

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
branch = true
parallel = true
relative_files = true
source = ["src/operetta_compose"]
omit = ["tests/*", "src/operetta_compose/dev/*"]

[tool.pytest.ini_options]
addopts = "--cov=operetta_compose"

# Pixi environment and task runner (see https://pixi.sh)
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
operetta-compose = { path = ".", editable = true, extras = ["dev"] }
# feature-classifier-core is not on PyPI yet; use the local checkout for dev.
# Remove this override once it is published (the version pin in [project]
# dependencies then resolves from PyPI).
feature-classifier-core = { path = "../external/napari-feature-classifier/core", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
manifest = "fractal-manifest create --package operetta-compose"
build = "hatch build"
